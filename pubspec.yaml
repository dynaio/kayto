name: kayto
description: "Kayto — per-app, per-source internet usage control."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  path_provider: ^2.1.5
  intl: ^0.20.2
  collection: ^1.19.1
  sqflite: ^2.4.1
  path: ^1.9.0
  shared_preferences: ^2.5.3
  package_info_plus: ^9.0.1
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
